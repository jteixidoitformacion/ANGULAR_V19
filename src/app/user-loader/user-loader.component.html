<div class="p-6 bg-white border border-slate-200 rounded-lg shadow-sm">
  <h3 class="text-lg font-bold text-[#1F2758]">
    Buscador de Usuarios Reactivo
  </h3>
  <div class="mt-3">
    <label class="block text-xs font-semibold text-slate-600"
      >ID de Usuario:</label
    >
    <input
      type="number"
      [value]="userId()"
      (input)="actualizarId($event)"
      class="border border-slate-300 rounded px-2 py-1 text-sm mt-1"
    />
  </div>
  <div class="mt-4">
    @if (userResource.isLoading()) {
      <p class="text-blue-500 text-sm animate-pulse">
        Cargando informacion del usuario...
      </p>
    } @else if (userResource.error()) {
      <p class="text-red-500 text-sm">Error al procesar la peticion.</p>
    } @else if (userResource.value()) {
      <div class="bg-emerald-50 border border-emerald-200 p-3 rounded">
        <p class="text-sm font-bold text-emerald-800">Usuario Encontrado:</p>
        <p class="text-xs text-emerald-900">
          Nombre: {{ userResource.value()?.name }}
        </p>
      </div>
    }
  </div>
</div>
