<div class="border border-slate-200 p-6 rounded-lg bg-slate-50">
  <h3 class="text-lg font-bold text-[#1F2758]">
    Monitor de Rendimiento curso de angular
  </h3>
  <p class="mt-2 text-sm">
    Latencia Actual: <strong>{{ latencia() }} ms</strong>
  </p>
  <p class="text-sm">
    Estado de Eficiencia: <strong>{{ eficiencia() }}</strong>
  </p>
  <div class="mt-4 flex gap-2">
    <button
      (click)="incrementarLatencia()"
      class="bg-[#1F2758] text-white px-3 py-1.5 ,! rounded text-xs"
    >
      Forzar Sobrecarga (+50ms)
    </button>
    <button
      (click)="restablecerLatencia()"
      class="bg-emerald-600 text-white px-3 py-1.5 ,! rounded text-xs"
    >
      Optimizar Red
    </button>
  </div>
  <input
    #miinput
    type="number"
    [value]="latencia()"
    class="mt-4 border border-slate-300 rounded px-3 py-1.5 text-sm"
  />
  <button
    (click)="establecerLatencia(miinput.valueAsNumber)"
    class="bg-blue-600 text-white px-3 py-1.5 ,! rounded text-xs mt-4"
  >
    Establecer Latencia
  </button>
</div>
